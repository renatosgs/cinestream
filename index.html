<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LAURA-IPTV</title>

  <!-- Configurações para rodar como App no iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="StreamFlix" />
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/play-button-circled.png" />

  <!-- Suporte a HLS / Canais Ao Vivo -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg-dark: #0d0f15;
      --card-bg: #181b24;
      --card-hover: #222634;
      --primary: #e50914;
      --text-white: #ffffff;
      --text-muted: #8b92a5;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 15, 21, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--primary);
    }
    .logo span { color: #fff; }

    .btn-icon {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Player Container */
    #player-container {
      width: 100%;
      background: #000;
      position: relative;
      max-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 280px;
      background: #000;
    }

    /* Abas de Navegação */
    .tabs {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      overflow-x: auto;
      background: var(--bg-dark);
    }

    .tab-btn {
      background: var(--card-bg);
      color: var(--text-muted);
      border: none;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
    }

    /* Campo de Busca */
    .search-box {
      padding: 8px 16px;
    }
    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
      border-radius: var(--radius);
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .search-box input::placeholder { color: var(--text-muted); }

    /* Lista de Conteúdo */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px 80px 16px;
    }

    .grid-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: transform 0.2s, background 0.2s;
    }

    .card:active {
      transform: scale(0.96);
      background: var(--card-hover);
    }

    .card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .card .title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card .category {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Modal de Configuração de M3U */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal.hidden { display: none; }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
    }
    .modal-content h3 { margin-bottom: 12px; }
    .modal-content input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #0d0f15;
      color: #fff;
      margin-bottom: 16px;
    }
    .modal-buttons {
      display: flex;
      gap: 10px;
    }
    .modal-buttons button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-save { background: var(--primary); color: #fff; }
    .btn-close { background: #333; color: #bbb; }
  </style>
</head>
<body>

  <header>
    <div class="logo">LAURA<span>IPTV</span></div>
    <button class="btn-icon" onclick="openModal()">⚙️ Lista M3U</button>
  </header>

  <!-- Reprodutor de Vídeo -->
  <div id="player-container">
    <video id="videoPlayer" controls playsinline webkit-playsinline autoplay></video>
  </div>

  <!-- Abas de Navegação -->
  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('canais')">📺 Canais Ao Vivo</button>
    <button class="tab-btn" onclick="setTab('filmes')">🎬 Filmes</button>
    <button class="tab-btn" onclick="setTab('series')">🍿 Séries</button>
  </div>

  <!-- Busca -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar canal, filme ou série..." oninput="filtrarConteudo()" />
  </div>

  <!-- Grade de Itens -->
  <main class="content-area">
    <div id="itemsGrid" class="grid-list"></div>
  </main>

  <!-- Modal de Inserção da Lista M3U -->
  <div id="modalM3U" class="modal hidden">
    <div class="modal-content">
      <h3>Adicionar Lista M3U</h3>
      <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 16px;">
        Cole o link da sua lista M3U/M3U8 fornecida pelo seu servidor:
      </p>
      <input type="url" id="m3uUrlInput" placeholder="https://exemplo.com/lista.m3u" />
      <div class="modal-buttons">
        <button class="btn-save" onclick="salvarLista()">Carregar</button>
        <button class="btn-close" onclick="closeModal()">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    let bancoDados = { canais: [], filmes: [], series: [] };
    let abaAtual = 'canais';
    let hlsInstance = null;
    const player = document.getElementById('videoPlayer');

    // Exemplos iniciais para teste imediato
    const listaPadrao = [
      { nome: "Red Bull TV (Ao Vivo)", url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8", tipo: "canais", logo: "https://upload.wikimedia.org/wikipedia/en/f/f5/Red_Bull_TV_logo.png" },
      { nome: "Big Buck Bunny (Filme Teste)", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", tipo: "filmes", logo: "https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.jpg" },
      { nome: "Sintel (Curta Metragem)", url: "https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8", tipo: "series", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Sintel_poster.jpg/320px-Sintel_poster.jpg" }
    ];

    window.onload = () => {
      const urlSalva = localStorage.getItem('m3u_url');
      if (urlSalva) {
        document.getElementById('m3uUrlInput').value = urlSalva;
        carregarM3U(urlSalva);
      } else {
        popularDados(listaPadrao);
      }
    };

    function setTab(tab) {
      abaAtual = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      filtrarConteudo();
    }

    function popularDados(itens) {
      bancoDados = { canais: [], filmes: [], series: [] };
      itens.forEach(item => {
        if (item.tipo === 'filmes') bancoDados.filmes.push(item);
        else if (item.tipo === 'series') bancoDados.series.push(item);
        else bancoDados.canais.push(item);
      });
      filtrarConteudo();
    }

    function filtrarConteudo() {
      const termo = document.getElementById('searchInput').value.toLowerCase();
      const lista = bancoDados[abaAtual] || [];
      const filtrados = lista.filter(item => item.nome.toLowerCase().includes(termo));
      renderizar(filtrados);
    }

    function renderizar(itens) {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';

      if (itens.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); margin-top: 40px;">Nenhum item encontrado.</p>`;
        return;
      }

      itens.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => tocarMidia(item.url, item.nome);
        card.innerHTML = `
          <img src="${item.logo || 'https://img.icons8.com/fluency/96/tv.png'}" onerror="this.src='https://img.icons8.com/fluency/96/tv.png'" />
          <div class="title">${item.nome}</div>
          <div class="category">${abaAtual.toUpperCase()}</div>
        `;
        grid.appendChild(card);
      });
    }

    function tocarMidia(url, nome) {
      if (Hls.isSupported() && url.includes('.m3u8')) {
        if (hlsInstance) hlsInstance.destroy();
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(player);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => player.play());
      } else {
        player.src = url;
        player.play().catch(err => console.log('Aguardando interação para reproduzir.'));
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal() { document.getElementById('modalM3U').classList.remove('hidden'); }
    function closeModal() { document.getElementById('modalM3U').classList.add('hidden'); }

    function salvarLista() {
      const url = document.getElementById('m3uUrlInput').value.trim();
      if (!url) return alert('Por favor, insira uma URL válida.');
      localStorage.setItem('m3u_url', url);
      closeModal();
      carregarM3U(url);
    }

    async function carregarM3U(url) {
      try {
        let resp;

        // 1. Tenta carregar pela Netlify Function
        try {
          resp = await fetch(`/api/proxy?url=${encodeURIComponent(url)}`);
        } catch (e) {
          resp = null;
        }

        // 2. Se a Netlify Function não responder, usa o proxy de contingência
        if (!resp || !resp.ok) {
          resp = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
        }

        if (!resp || !resp.ok) {
          throw new Error('Falha na requisição');
        }

        const texto = await resp.text();
        const linhas = texto.split('\n');
        let itens = [];
        let itemAtual = null;

        for (let linha of linhas) {
          linha = linha.trim();
          if (linha.startsWith('#EXTINF:')) {
            const partes = linha.split(',');
            const nome = partes.length > 1 ? partes.slice(1).join(',') : "Sem Nome";
            const logoMatch = linha.match(/tvg-logo="([^"]+)"/);
            const groupMatch = linha.match(/group-title="([^"]+)"/);
            const grupo = (groupMatch ? groupMatch[1] : '').toLowerCase();

            let tipo = 'canais';
            if (grupo.includes('filme') || grupo.includes('movie') || grupo.includes('vod')) tipo = 'filmes';
            if (grupo.includes('serie') || grupo.includes('series')) tipo = 'series';

            itemAtual = {
              nome: nome.trim(),
              logo: logoMatch ? logoMatch[1] : '',
              tipo: tipo
            };
          } else if (linha && !linha.startsWith('#') && itemAtual) {
            itemAtual.url = linha;
            itens.push(itemAtual);
            itemAtual = null;
          }
        }

        if (itens.length === 0) {
          alert('Lista carregada, mas nenhum canal/filme válido foi encontrado.');
          return;
        }

        popularDados(itens);
      } catch (e) {
        console.error(e);
        alert('Não foi possível carregar a lista. Verifique se o link está correto ou tente novamente.');
      }
    }
  </script>
</body>
</html>
